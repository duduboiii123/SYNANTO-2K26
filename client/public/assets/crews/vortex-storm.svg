<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vortexBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glassGradVortex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="vortexShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="415" rx="340" ry="25" fill="#000000" opacity="0.85" filter="blur(8px)"/>

  <!-- CAR BODY GROUP -->
  <g filter="url(#vortexShadow)">
    <!-- Carbon Fiber Active Aero Wing -->
    <path d="M 90 170 L 60 120 L 220 115 L 240 165 Z" fill="#0f172a" stroke="#2563eb" stroke-width="3"/>
    <path d="M 110 170 L 120 125 L 140 125 L 130 170 Z" fill="#1e293b"/>
    <path d="M 195 165 L 205 120 L 225 120 L 215 165 Z" fill="#1e293b"/>

    <!-- Sharp Titanium Monocoque Shell -->
    <path d="M 80 330 C 65 270, 115 210, 190 190 C 260 140, 420 125, 570 165 C 670 185, 745 235, 765 305 C 775 340, 745 375, 690 375 L 130 375 C 95 375, 75 355, 80 330 Z" fill="url(#vortexBodyGrad)" stroke="#2563eb" stroke-width="3"/>

    <!-- Quantum Blue Cyber Angle Livery -->
    <path d="M 190 345 L 380 265 L 560 280 L 640 270 L 460 325 L 240 365 Z" fill="url(#cyberBlueGrad)" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 330 315 L 430 275 L 470 275 L 390 330 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Cabin / Roof Shell -->
    <path d="M 215 200 C 255 135, 380 120, 545 155 C 595 195, 620 235, 620 240 L 200 240 Z" fill="#0f172a"/>

    <!-- Digital HUD Windshield (Focused Digital Eyes) -->
    <path d="M 375 145 C 455 140, 535 155, 575 200 C 560 220, 500 225, 365 220 C 355 190, 360 160, 375 145 Z" fill="url(#glassGradVortex)" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Left Eye -->
    <ellipse cx="435" cy="180" rx="20" ry="24" fill="#ffffff"/>
    <ellipse cx="438" cy="180" rx="12" ry="14" fill="#2563eb"/>
    <ellipse cx="440" cy="180" rx="6" ry="8" fill="#0284c7"/>
    <circle cx="443" cy="175" r="3.5" fill="#38bdf8"/>
    <!-- Right Eye -->
    <ellipse cx="505" cy="185" rx="18" ry="22" fill="#ffffff"/>
    <ellipse cx="508" cy="185" rx="11" ry="13" fill="#2563eb"/>
    <ellipse cx="510" cy="185" rx="5" ry="7" fill="#0284c7"/>
    <circle cx="513" cy="181" r="3" fill="#38bdf8"/>
    <!-- Sharp Cyber Eyelids -->
    <path d="M 405 168 Q 435 155 460 168" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 480 172 Q 508 160 528 172" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Front Nose & Cyber Grille -->
    <path d="M 630 250 C 730 260, 765 300, 760 340 C 735 365, 665 365, 615 360 Z" fill="#020617"/>
    <!-- Cyber Grille Bar -->
    <path d="M 650 305 L 750 310 L 740 330 L 650 325 Z" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <line x1="660" y1="317" x2="735" y2="320" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Laser Blue Angular Headlights -->
    <polygon points="645,250 690,265 675,280 635,265" fill="#38bdf8" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="575,230 610,240 600,255 570,245" fill="#38bdf8" stroke="#60a5fa" stroke-width="2"/>

    <!-- Racing Number #20 Decal -->
    <g transform="matrix(0.95 0 -0.2 0.95 320 265)">
      <text x="0" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="68" font-weight="900" fill="#ffffff" stroke="#1d4ed8" stroke-width="6" font-style="italic">20</text>
      <text x="0" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="68" font-weight="900" fill="url(#cyberBlueGrad)" font-style="italic">20</text>
    </g>

    <!-- Side Cyber Badges -->
    <text x="200" y="325" font-family="sans-serif" font-size="11" font-weight="900" fill="#38bdf8" letter-spacing="2">IGNITR DIGITAL</text>

    <!-- Front Wheel / Rim -->
    <g>
      <ellipse cx="625" cy="355" rx="55" ry="55" fill="url(#tireGrad)"/>
      <ellipse cx="625" cy="355" rx="40" ry="40" fill="#0f172a" stroke="#2563eb" stroke-width="5"/>
      <ellipse cx="625" cy="355" rx="18" ry="18" fill="#38bdf8"/>
      <line x1="625" y1="315" x2="625" y2="395" stroke="#38bdf8" stroke-width="5"/>
      <line x1="585" y1="355" x2="665" y2="355" stroke="#38bdf8" stroke-width="5"/>
    </g>

    <!-- Rear Wheel / Rim -->
    <g>
      <ellipse cx="185" cy="355" rx="65" ry="65" fill="url(#tireGrad)"/>
      <ellipse cx="185" cy="355" rx="48" ry="48" fill="#0f172a" stroke="#2563eb" stroke-width="6"/>
      <ellipse cx="185" cy="355" rx="22" ry="22" fill="#38bdf8"/>
      <line x1="185" y1="307" x2="185" y2="403" stroke="#38bdf8" stroke-width="6"/>
      <line x1="137" y1="355" x2="233" y2="355" stroke="#38bdf8" stroke-width="6"/>
    </g>
  </g>
</svg>
